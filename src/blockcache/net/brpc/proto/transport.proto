syntax = "proto3";

package dingofs.pb.cache.v2;

option cc_generic_services = true;

// One generic verb, carrying an opcode and an opaque payload.
//
// There is deliberately no method per operation: dispatch belongs to the
// shared core::ServiceTable, so adding an opcode never touches this file and a handler
// written once serves over rdma and brpc alike. It also keeps the wire cost
// of dispatch at two bytes instead of a service and method name.
//
// It lives here rather than in proto/ because that directory is the
// dingofs-proto submodule, which this repository does not own.
// `payload` is for small, message-shaped data. Bulk does NOT belong here: a
// block put in this field is copied about three times (parsed out of the
// IOBuf, copied by the handler, serialised back in), which measured 4x slower
// than the alternative at 4 MB. Bulk rides the brpc attachment instead --
// see BrpcRequest::body and BrpcClient::Call.
message RpcRequest {
  uint32 opcode = 1;  // 16-bit; a larger value is rejected, never masked
  bytes payload = 2;
  // A key hash the client already computed, which the server turns into a
  // shard with net::ShardOf. Both ends call the same function, so a
  // block lands on the core that owns its index whichever wire carried it --
  // over rdma the same choice is made by dialling listen_port + shard.
  //
  // Eight fixed bytes rather than having the server hash the payload: that
  // would parse the request on a bthread only to have the handler parse it
  // again on the shard, and would weld routing to the payload encoding.
  // 0 means the caller does not care.
  fixed64 route = 3;
}

message RpcResponse {
  // kReplyOk / kReplyBadOpcode / kReplyHandlerError /
  uint32 code = 1;
  bytes payload = 2;
}

service RpcTransport {
  rpc Call(RpcRequest) returns (RpcResponse);
}
