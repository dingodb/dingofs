# Required repository ruleset configuration (outside this workflow):
# - require status check: trusted-source
# - expected source: GitHub Actions
# - accept both fork and same-repository pull requests
# - merge queue grouping strategy: ALLGREEN
# - no bypass actors

name: PR Source

on:
  pull_request_target:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-source:
    if: vars.TRUSTED_SOURCE_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Accept pull request source
        if: github.event_name == 'pull_request_target'
        run: echo "Fork and same-repository pull requests are allowed"

      - name: Confirm merge queue admission
        if: github.event_name == 'merge_group'
        run: echo "The merge group is admitted"
